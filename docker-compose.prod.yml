# ==============================================================================
# DIGITAL SIGNING PLATFORM - DOCKER COMPOSE SERVER ON-PREMISES (MK INTRANET/LAN)
# Deploy command: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE SERVICE (PostgreSQL 16 Relational Engine)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: digital_signature_db
    restart: always
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-digital_signature_db}
    # Port 5432 hanya di-expose ke internal Docker network (terisolasi)
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-digital_signature_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform_network

  # ----------------------------------------------------------------------------
  # 2. INTERNAL PKI SERVICE (OpenSSL 3.x Certificate Engine)
  # ----------------------------------------------------------------------------
  pki_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.pki
    container_name: digital_signature_pki
    restart: always
    env_file:
      - .env.production
    expose:
      - "8001"
    environment:
      - ENVIRONMENT=production
      - PKI_PORT=8001
      - PKI_SERVICE_TOKEN=${PKI_SERVICE_TOKEN}
      - PKI_ENGINE_DIR=/app/pki/scripts
      - P12_ARCHIVE_DIR=/app/sign-api/p12
      - INTER_CA_PASS=${INTER_CA_PASS}
      - DEFAULT_PFX_PASS=${DEFAULT_PFX_PASS:-Mkri006!}
      - DEFAULT_USER_PASS=${DEFAULT_USER_PASS:-Konstitusi100%}
    volumes:
      - ./pki:/app/pki
      - ./sign-api/p12:/app/sign-api/p12
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 2
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - platform_network

  # ----------------------------------------------------------------------------
  # 3. BACKEND API SERVICE (FastAPI Production Worker)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: digital_signature_backend
    restart: always
    env_file:
      - .env.production
    # Port 8000 diekspos agar aplikasi/skrip internal lain di server MK bisa mengakses API langsung
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-digital_signature_db}
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - PKI_SERVICE_URL=http://pki_service:8001
      - PKI_SERVICE_TOKEN=${PKI_SERVICE_TOKEN}
      - ISSUED_DIR=/app/pki/issued
      - P12_ARCHIVE_DIR=/app/sign-api/p12
      - DEFAULT_PFX_PASS=${DEFAULT_PFX_PASS:-Mkri006!}
      - DEFAULT_USER_PASS=${DEFAULT_USER_PASS:-Konstitusi100%}
      - ENABLE_PDF_SIGNING=true
      - API_KEY=${API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - PORT=8000
    volumes:
      - ./pki/issued:/app/pki/issued:ro
      - ./sign-api/p12:/app/sign-api/p12:ro
    # Mode produksi: alembic upgrade lalu uvicorn multi-worker tanpa --reload
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    depends_on:
      postgres:
        condition: service_healthy
      pki_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - platform_network

  # ----------------------------------------------------------------------------
  # 4. FRONTEND & REVERSE PROXY (Nginx - Akses Intranet / LAN MK)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend.prod
    container_name: digital_signature_frontend
    restart: always
    # Mendukung akses browser via Port 3000, Port 80 (HTTP standar), dan Port 443 (HTTPS)
    ports:
      - "3000:3000"
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/certs:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - platform_network

volumes:
  postgres_data:

networks:
  platform_network:
    driver: bridge
