services:
  postgres:
    image: postgres:16-alpine
    container_name: digital_signature_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-digital_signature_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-digital_signature_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform_network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: digital_signature_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-digital_signature_db}
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PKI_ENGINE_DIR=/app/pki/scripts
      - P12_ARCHIVE_DIR=/app/sign-api/p12
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
      - PORT=8000
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./pki:/app/pki
      - ./sign-api:/app/sign-api
      - ./sign-api:/app/sign-api(well3)
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - platform_network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: digital_signature_frontend
    restart: always
    profiles:
      - frontend
      - full
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - platform_network

volumes:
  postgres_data:

networks:
  platform_network:
    driver: bridge
