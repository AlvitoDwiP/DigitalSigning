services:
  postgres:
    image: postgres:16-alpine
    container_name: digital_signature_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-digital_signature_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-digital_signature_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform_network

  pki_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.pki
    container_name: digital_signature_pki
    restart: always
    expose:
      - "8001"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PKI_PORT=8001
      - PKI_SERVICE_TOKEN=${PKI_SERVICE_TOKEN:-dev-internal-pki-secret-token-2026}
      - PKI_ENGINE_DIR=/app/pki/scripts
      - P12_ARCHIVE_DIR=/app/sign-api/p12
      - INTER_CA_PASS=${INTER_CA_PASS:-InterPass!ChangeMe123}
      - DEFAULT_PFX_PASS=${DEFAULT_PFX_PASS:-Mkri006!}
      - DEFAULT_USER_PASS=${DEFAULT_USER_PASS:-Konstitusi100%}
    volumes:
      - ./pki:/app/pki
      - ./sign-api/p12:/app/sign-api/p12
      - ./pki-service/app:/app/app
      - ./pki-service/tests:/app/tests:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - platform_network
    
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: digital_signature_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-digital_signature_db}
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PKI_SERVICE_URL=http://pki_service:8001
      - PKI_SERVICE_TOKEN=${PKI_SERVICE_TOKEN:-dev-internal-pki-secret-token-2026}
      - ISSUED_DIR=/app/pki/issued
      - P12_ARCHIVE_DIR=/app/sign-api/p12
      - DEFAULT_PFX_PASS=${DEFAULT_PFX_PASS:-Mkri006!}
      - DEFAULT_USER_PASS=${DEFAULT_USER_PASS:-Konstitusi100%}
      - ENABLE_PDF_SIGNING=${ENABLE_PDF_SIGNING:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000}
      - PORT=8000
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests:ro
      - ./pki/issued:/app/pki/issued:ro
      - ./sign-api/p12:/app/sign-api/p12:ro
      - ./frontend/dist:/app/frontend/dist:ro
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      pki_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - platform_network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: digital_signature_frontend
    restart: always
    profiles:
      - frontend-standalone
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - platform_network

volumes:
  postgres_data:

networks:
  platform_network:
    driver: bridge
