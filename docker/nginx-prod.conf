# ==============================================================================
# NGINX CONFIGURATION - SERVER ON-PREMISES / INTRANET MK (LAN)
# Mendukung akses HTTP langsung (Port 80 & 3000) dan HTTPS opsional (Port 443)
# ==============================================================================

# Rate limiting zone untuk keamanan API (30 req/sec burst)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# ------------------------------------------------------------------------------
# 1. HTTP Server (Port 80 & Port 3000) - Akses Intranet / LAN Server MK
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 3000 default_server;
    listen [::]:3000 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Batas ukuran payload unggah PDF dan stempel (35 MB)
    client_max_body_size 35M;

    # Gzip compression untuk performa jaringan LAN
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache file statis
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API Gateway ke Backend FastAPI
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout disesuaikan untuk proses tanda tangan dokumen PDF tebal
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    # Health check proxy
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server (Port 443) - Opsional jika intranet MK mengaktifkan SSL
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 35M;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
